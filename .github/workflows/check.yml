name: 검증

on:
  push:
    branches: [main]
    paths:
      - 'mac-monitor/**'
      - '.github/workflows/check.yml'
  pull_request:
    paths:
      - 'mac-monitor/**'
      - '.github/workflows/check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-monitor:
    name: mac-monitor 검사 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mac-monitor
    steps:
      - name: 소스 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node 24 준비
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mac-monitor/package-lock.json
      - name: 개발 의존성 설치
        run: npm ci --no-audit --no-fund
      - name: 타입 검사
        run: npm run typecheck
      - name: 단위 테스트
        run: npm test
      - name: 커밋된 prebuilt 바이너리 실행
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          bin/macmon-helper --once | node --import tsx --input-type=module -e '
            import assert from "node:assert/strict";
            import { rawSchema } from "./shared/contracts.ts";
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            const sample = rawSchema.parse(JSON.parse(input));
            assert.ok(sample.sys.pageSize > 0 && sample.sys.memsize > 0);
            assert.ok(sample.sys.cpu && sample.sys.vm);
            assert.deepEqual(sample.errors, []);
            console.log(process.arch + " prebuilt 실행 확인 완료");
          '
      - name: universal 헬퍼 빌드와 서명 확인
        run: |
          npm run build
          lipo bin/macmon-helper -verify_arch arm64 x86_64
          codesign --verify --strict bin/macmon-helper
      - name: 네이티브 JSON 스키마 확인
        run: |
          bin/macmon-helper --once | node --import tsx --input-type=module -e '
            import { rawSchema } from "./shared/contracts.ts";
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            rawSchema.parse(JSON.parse(input));
            console.log("네이티브 JSON 스키마 확인 완료");
          '
