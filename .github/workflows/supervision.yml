name: supervision 검증
on:
  push:
    branches: [main]
    paths: ['supervision/**', '.github/workflows/supervision.yml']
  pull_request:
    paths: ['supervision/**', '.github/workflows/supervision.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supervision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sdk: ['0.15.4', '0.16.1']
    defaults:
      run:
        working-directory: supervision
    steps:
      - name: 소스 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node 24 준비
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: supervision/package-lock.json
      - name: 의존성 설치
        run: npm ci --no-audit --no-fund
      - name: 대상 SDK 설치
        if: matrix.sdk != '0.15.4'
        env:
          SDK: ${{ matrix.sdk }}
        run: npm install --no-save --package-lock=false --no-audit --no-fund "@getpaseo/plugin@$SDK" "@getpaseo/client@$SDK" "@getpaseo/protocol@$SDK"
      - name: 빌드·타입·경계 검사
        env:
          SDK: ${{ matrix.sdk }}
        run: |
          node -e 'for (const name of ["plugin", "client", "protocol"]) { const version = require(`./node_modules/@getpaseo/${name}/package.json`).version; console.log(`${name}: ${version}`); if (version !== process.env.SDK) throw new Error("SDK 버전 불일치"); }'
          npm run build
      - name: lane·탐색·전환 검사
        run: npm test
